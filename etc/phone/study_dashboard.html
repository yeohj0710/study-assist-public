<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>학습 보조기 진행 화면</title>
<style>
/* Keep the dashboard dark and reserve motion for intentional screen changes. */
:root{
  color-scheme:dark;
  font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-synthesis:weight;
  --bg:#0b0f0d;--surface:#111614;--raised:#171e1b;--select:#1b2420;
  --edge:#25302b;--rule:#1c2521;
  --ink:#e1e8e4;--soft:#c3cec8;--muted:#97a79f;
  --accent:#9cc3ae;--link:#b3c8e2;
  --ok-bg:#15251d;--ok:#a6cfb8;--run-bg:#16202b;--run:#b3c7e3;--warn-bg:#271c16;--warn:#e6b39e;
  --dot:#6f7d76;--online:#8fc2a6;--offline:#e39c90;
  color:var(--ink);background:var(--bg);
  scrollbar-color:#34403a transparent;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,a,summary{-webkit-tap-highlight-color:transparent}
*,*::before,*::after{transition:none;animation:none;scroll-behavior:auto}

.shell{max-width:1100px;margin:0 auto;padding:32px 24px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(24px,3.2vw,34px);font-weight:750;letter-spacing:-.02em;line-height:1.2}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;color:var(--soft)}
.hint{font-size:13px;color:var(--muted);line-height:1.55}
.status{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--edge);border-radius:999px;background:var(--surface);font-weight:650;font-size:13px;white-space:nowrap;color:var(--muted)}
.dot{width:8px;height:8px;background:var(--dot);border-radius:50%}
.status.online{color:var(--online)}.online .dot{background:var(--online)}
.status.offline{color:var(--offline)}.offline .dot{background:var(--offline)}

.providers{display:flex;flex-wrap:wrap;gap:8px 24px;border-bottom:1px solid var(--rule);padding:4px 4px 16px;margin-bottom:24px}
.provider{font-size:13px;color:var(--muted);line-height:1.7}
.provider b{color:var(--soft);font-weight:650;margin-right:6px}
.provider .activity{color:var(--accent);font-weight:650}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--edge);border-radius:14px;min-width:0;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 20px 12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 16px 12px}
.tabs button{border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);padding:6px 10px;font-size:13px;font-weight:650;cursor:pointer}
.tabs button:hover{background:var(--raised);color:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--select);border-color:#33433b;color:var(--ink)}
.metrics{padding:0 20px 12px;color:var(--muted);font-size:13px;line-height:1.6}
.metrics strong{color:var(--soft)}
.list{max-height:480px;min-height:112px;overflow:auto;overscroll-behavior:contain}
.detail{padding:0 20px 20px}
.empty{padding:20px;color:var(--muted);font-size:14px;line-height:1.65;border-top:1px solid var(--rule)}

.row{width:100%;border:0;border-top:1px solid var(--rule);border-left:3px solid transparent;background:none;text-align:left;cursor:pointer;display:grid;align-items:start;grid-template-columns:64px 80px minmax(0,1fr) auto;gap:8px 12px;padding:12px 16px 12px 13px;color:var(--ink);font-size:13px}
.row:hover{background:var(--raised)}
.row[aria-current=true]{background:var(--select);border-left-color:var(--accent)}
.row time{font-variant-numeric:tabular-nums;color:var(--muted)}
.label{color:var(--soft);font-weight:650}
.row .title{overflow-wrap:anywhere;line-height:1.5}
.badge{padding:2px 8px;font-size:11px;line-height:1.6;border-radius:6px;background:var(--raised);border:1px solid var(--edge);color:var(--soft);text-align:center;white-space:nowrap;font-weight:650}
.badge.running,.badge.queued{background:var(--run-bg);border-color:#243244;color:var(--run)}
.badge.done,.badge.acknowledged,.badge.saved{background:var(--ok-bg);border-color:#23382c;color:var(--ok)}
.badge.error,.badge.held,.badge.retry{background:var(--warn-bg);border-color:#3a2a21;color:var(--warn)}

.jobs{display:grid;gap:0}
.job{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;border:0;border-top:1px solid var(--rule);border-left:3px solid transparent;padding:12px 20px 12px 17px;background:none;cursor:pointer;color:var(--ink)}
.job:hover{background:var(--raised)}
.job[aria-current=true]{background:var(--select);border-left-color:var(--accent)}
.job small{color:var(--muted);font-size:12px;grid-column:1/-1}
.job strong{font-size:14px;font-weight:700}
.job small,.job strong{overflow-wrap:anywhere}

.inspector{grid-column:1/-1}
.inspector .detail{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr);gap:12px 32px}
.section{border-top:1px solid var(--rule);padding:16px 0 4px;min-width:0}
.section h3{margin:0 0 8px}
.section h3+*{margin-top:0}
.section p+h3,.section ul+h3,.section details+h3,.section table+h3{margin-top:16px}
.section p,.section li,.section summary{font-size:14px;line-height:1.65;overflow-wrap:anywhere;color:var(--ink)}
.section ul{padding-left:20px;margin:8px 0}
.section li::marker{color:var(--muted)}
.section summary{cursor:pointer;color:var(--link);font-weight:650;margin-top:12px}
.section pre{margin:8px 0 0;padding:12px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;font:inherit;font-size:14px;line-height:1.65;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere;max-height:390px;overflow:auto}
.photos{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px}
.photos a{display:block;color:var(--link);font-size:12px;text-decoration:none;font-weight:650}
.photos a:hover span{text-decoration:underline}
.photos img{display:block;width:112px;height:80px;object-fit:contain;border:1px solid var(--edge);border-radius:8px;background:var(--bg);margin-bottom:4px}
.coverage{font-size:13px;border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.coverage td,.coverage th{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left}
.coverage th{color:var(--muted);font-weight:650}

@media(max-width:960px){
  .shell{padding:28px 20px}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:minmax(0,1fr) minmax(280px,1fr)}
}
@media(max-width:760px){
  .shell{padding:24px 14px 24px}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px}
  .step:last-child{grid-column:1/-1}
  .grid{grid-template-columns:1fr}
  .inspector .detail{grid-template-columns:1fr;gap:0}
  .row{grid-template-columns:56px 60px minmax(0,1fr) auto;padding:10px 12px 10px 9px;gap:4px 8px}
  .panel-head{padding-inline:16px}
  .tabs{padding-inline:12px}
  .metrics,.detail{padding-inline:16px}
  .job{padding-inline:13px 16px}
}
@media(max-width:480px){
  .row{grid-template-columns:auto minmax(0,1fr) auto}
  .row .title{grid-column:1/-1;grid-row:2}
  .status{padding:4px 10px}
}
@media(forced-colors:active){
  .row[aria-current=true],.job[aria-current=true],.step[aria-pressed=true],.tabs button[aria-pressed=true]{outline:2px solid Highlight}
}
.queue{padding:14px 17px;margin:0 0 20px;border:1px solid #303936;border-radius:12px;background:#111715;display:grid;gap:6px}
.queue h2{font-size:15px}.queue p{font-size:13px;color:#afbeb6;line-height:1.5;overflow-wrap:anywhere}

.models{display:flex;align-items:end;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;padding:12px 17px;border:1px solid #303936;border-radius:12px;background:#111715;font-size:13px}
.models[hidden]{display:none}
.model-presets{display:flex;gap:5px;flex-basis:100%}
.model-presets button[aria-pressed="true"]{background:#294038;border-color:#9cc3ae;color:#f1faf4}
.models label{display:grid;gap:5px;color:#ccd7d0}
.models label:last-of-type{display:flex;align-items:center;gap:7px;min-height:33px}
.models select,.models button{border:1px solid #37483e;border-radius:7px;background:#1a2420;color:#e1e8e4;min-height:33px;padding:0 9px;font:inherit}
.models button{cursor:pointer}
.models input{accent-color:#9cc3ae}
.jobs-panel .list{max-height:680px}
.job{padding:14px 20px;column-gap:12px;row-gap:5px}
.job strong{font-size:16px}
.job .job-model,.job .job-path,.job .job-reason{grid-column:1/-1;line-height:1.55;font-size:13px;overflow-wrap:anywhere}
.job .job-model{color:#b8c8c0;font-weight:650}
.job .job-path{color:#a7adae}
.job .job-reason{color:#ebeeec;margin-top:2px;font-size:14px}
@media(max-width:760px){.jobs-panel .list{max-height:560px}}

#photo-modal{width:min(900px,calc(100vw - 32px));max-height:92vh;padding:16px;border:1px solid #36423d;border-radius:14px;background:#111715;color:#e3eae6;margin:auto}
#photo-modal::backdrop{background:rgba(0,0,0,.82)}
.photo-header,.photo-controls{display:flex;align-items:center;justify-content:space-between;gap:10px}
.photo-header h2{font-size:18px}
#photo-modal button,.photo-open{background:#1a2420;color:#dce8e0;border:1px solid #34423b;border-radius:8px;cursor:pointer;padding:8px 11px;font:inherit}
#photo-modal button:disabled{opacity:.42;cursor:default}
#photo-large{width:100%;height:min(67vh,680px);object-fit:contain;background:#090c0b;display:block;margin:12px 0;border-radius:8px}
.photo-open{padding:5px;font-size:12px;text-align:left;color:#bbd7c7}
.photo-open img{margin:0 0 3px}

.live-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:12px;margin-bottom:16px;align-items:start}
.live-controls{display:grid;gap:10px;min-width:0}
.live-controls .models,.live-controls .queue{margin:0}
.live-controls .models{gap:6px 12px}
.live-controls .models .hint:empty{display:none}
.live-photos{min-width:0}
@media(max-width:840px){.live-grid{grid-template-columns:minmax(0,1fr)}}
.live-photos .panel-head{padding-bottom:10px}
.live-body{display:grid;grid-template-columns:minmax(0,3fr) minmax(100px,1fr);gap:12px;padding:0 18px 16px}
.live-image{background:#080b09;border:1px solid #303b35;width:100%;padding:0;display:block;border-radius:9px;cursor:zoom-in}
.live-image img{display:block;width:100%;height:clamp(160px,22vw,230px);object-fit:contain;border-radius:8px}
.live-meta{font-size:13px;color:#bac9c0;line-height:1.55;margin-top:7px;overflow-wrap:anywhere}
.live-recent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-content:start}
.live-recent .photo-open img{height:54px;width:100%;object-fit:contain;background:#101411}
@media(max-width:560px){.live-body{grid-template-columns:1fr;padding:0 12px 12px}.live-recent{grid-template-columns:repeat(4,minmax(0,1fr))}.live-recent .photo-open img{height:38px}}
.app-header{padding-bottom:18px;border-bottom:1px solid var(--rule)}
.header-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.utility,.screen-nav button{border:1px solid var(--edge);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:14px;font-weight:650;cursor:pointer}
.utility:hover,.screen-nav button:hover{background:var(--raised)}
.utility:disabled{opacity:.5;cursor:default}
.screen-nav{display:flex;gap:8px;margin:16px 0 20px}
.screen-nav button[aria-current=page]{background:var(--select);border-color:#436154;color:var(--accent)}
.screen[hidden]{display:none}
.live-grid{grid-template-columns:minmax(225px,.85fr) minmax(0,1.15fr);align-items:start}
#overview .queue{grid-template-columns:auto minmax(200px,1fr) minmax(185px,1fr);align-items:center;margin:0 0 14px;padding:12px 16px;gap:14px}
#overview .queue h2{font-size:16px;white-space:nowrap}
.queue-stats{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.queue-stat{border-left:1px solid var(--rule);padding-left:9px;min-width:0}
.live-body{grid-template-columns:minmax(0,1fr)}
.live-recent{grid-template-columns:repeat(4,minmax(0,1fr))}
.job .job-reason{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.metrics:empty{display:none}
.queue-stat dt{font-size:12px;color:var(--muted)}
.queue-stat dd{margin:1px 0 0;font-size:22px;color:var(--ink);font-weight:720;font-variant-numeric:tabular-nums}
.queue-lines{min-height:36px;display:grid;gap:5px}
.history-grid .inspector{grid-column:auto;min-height:170px}
.history-grid .inspector .detail{grid-template-columns:minmax(0,1fr);gap:8px}
.history-grid .coverage{display:block;max-width:100%;overflow:auto}
.system-info{padding:10px 14px;border:1px solid var(--edge);border-radius:10px;margin:0 0 16px;background:var(--surface)}
.system-info summary{font-size:14px;cursor:pointer;color:var(--soft);font-weight:650}
.system-info .providers{border:0;margin:10px 0 0;padding:0}
.system-info #device-detail{padding-top:6px}
#model-dialog{width:min(530px,calc(100vw - 28px));padding:18px;border:1px solid #36423d;border-radius:14px;background:var(--surface);color:var(--ink);margin:auto}
#model-dialog::backdrop{background:rgba(0,0,0,.74)}
#model-dialog .models{margin:12px 0 0;padding:0;border:0;background:none}
.model-hint{margin-top:8px}
@media(max-width:760px){.history-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-height:720px){.live-image img{height:clamp(135px,27vh,190px)}}
@media(max-width:680px){.live-grid{grid-template-columns:minmax(0,1fr)}#overview .queue{grid-template-columns:1fr;gap:9px}.queue-stat:first-child{border-left:0;padding-left:0}.shell{padding:20px 14px}.app-header{gap:10px}.screen-nav{margin:11px 0 14px}.live-image img{height:clamp(145px,39vw,220px)}}
@media(max-width:420px){.header-actions{gap:5px}.header-actions .status{padding:4px 8px;font-size:11px}.header-actions .utility{padding:6px 9px;font-size:12px}.app-header h1{font-size:22px}.screen-nav button{flex:1}.panel-head{padding-left:14px;padding-right:14px}}
@media(prefers-reduced-motion:no-preference){
  @keyframes appear{from{opacity:.82;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
  .screen:not([hidden]),#model-dialog[open],#photo-modal[open]{animation:appear 150ms ease-out both}
  .utility,.screen-nav button,.model-presets button{transition:background-color 130ms ease,border-color 130ms ease}
}

</style>
</head>
<body>
<main class="shell">
<header class="app-header">
  <h1>학습 보조기</h1>
  <div class="header-actions">
    <div id="connection" class="status" role="status"><span class="dot"></span><span>연결 확인 중</span></div>
    <button type="button" id="model-open" class="utility" aria-haspopup="dialog" disabled>모델 설정</button>
  </div>
</header>
<nav class="screen-nav" aria-label="대시보드 화면">
  <button type="button" id="show-overview" aria-controls="overview" aria-current="page">지금 진행</button>
  <button type="button" id="show-history" aria-controls="history">전체 기록</button>
</nav>
<section id="overview" class="screen" aria-label="지금 진행">
  <section id="queue" class="queue" aria-label="작업 대기열"></section>
  <div class="live-grid">
    <section id="live-photos" class="panel live-photos" aria-label="폰에서 받은 사진"></section>
    <section class="panel jobs-panel">
      <div class="panel-head"><h2>문항별 풀이</h2><span id="range" class="hint"></span></div>
      <div class="metrics" id="metrics"></div>
      <div class="list jobs" id="jobs"><p class="empty">사진에서 문항을 찾으면 여기에 표시합니다.</p></div>
    </section>
  </div>
</section>
<section id="history" class="screen" aria-label="전체 기록" hidden>
  <details class="system-info">
    <summary>모델 연결과 기기 상태</summary>
    <div id="providers" class="providers" aria-label="모델 제공자"></div>
    <div id="device-detail" class="hint"></div>
  </details>
  <div class="grid history-grid">
    <section class="panel timeline-panel"><div class="panel-head"><h2>실시간 기록</h2><span id="clock" class="hint"></span></div>
      <div id="tabs" class="tabs" aria-label="기록 필터"></div>
      <div id="events" class="list"><p class="empty">노트북 서버에 연결하는 중입니다.</p></div>
    </section>
    <section class="panel inspector" id="inspector" tabindex="-1"><div class="panel-head"><h2 id="detail-title">처리 상세</h2></div>
      <div class="detail" id="detail"><p class="hint">기록이나 문항을 선택하면 사용한 사진과 처리 결과를 볼 수 있습니다.</p></div>
    </section>
  </div>
</section>
</main>
<dialog id="model-dialog" aria-labelledby="model-title">
  <header class="photo-header"><h2 id="model-title">모델 설정</h2><button type="button" id="model-close" class="utility">닫기</button></header>
  <p class="hint model-hint">빠르게는 Luna로 풀고, 균형과 정밀은 Sol로 풉니다. 판별과 풀이를 따로 고를 수도 있습니다.</p>
<form id="model-settings" class="models" aria-label="모델 설정" hidden>
  <div role="group" aria-label="모델 빠른 선택" class="model-presets">
    <button type="button" data-preset="fast" aria-pressed="false">빠르게</button>
    <button type="button" data-preset="balanced" aria-pressed="false">균형</button>
    <button type="button" data-preset="precise" aria-pressed="false">정밀</button>
  </div>
  <label>판별 모델<select name="route"><option value="gpt-6.1-sol">Sol 6.1</option><option value="gpt-6-luna">Luna 6</option><option value="gpt-6.1-terra">Terra 6.1</option></select></label>
  <label>풀이 모델<select name="solve"><option value="gpt-6.1-sol">Sol 6.1</option><option value="gpt-6-luna">Luna 6</option><option value="gpt-6.1-terra">Terra 6.1</option></select></label>
  <label><input type="checkbox" name="parallel">밀리면 두 묶음 동시 판별</label>
  <button type="submit">적용</button><span id="model-save" class="hint" role="status"></span>
</form>
</dialog>
<dialog id="photo-modal" aria-labelledby="photo-title">
  <div class="photo-header"><h2 id="photo-title">판독 원본</h2><button type="button" id="photo-close">닫기</button></div>
  <img id="photo-large" alt="">
  <div class="photo-controls">
    <button type="button" id="photo-prev">이전 사진</button>
    <span id="photo-count" role="status"></span>
    <button type="button" id="photo-next">다음 사진</button>
  </div>
</dialog>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  if (cls) node.className = cls;
  return node;
};
const stages = {capture:'촬영', image:'사진 처리', route:'총괄 판별', fragment:'조각 취합',
  model:'모델 호출', solve:'문항 풀이', delivery:'폰 신호', listening:'듣기', system:'서버'};
const labels = {received:'수신', started:'시작', selected:'보관 후보', skipped:'제외', archived:'보관', matched:'일치',
  excluded:'문제지 아님', queued:'대기', running:'진행 중', done:'완료', waiting:'조각 대기', held:'보류', error:'실패', retry:'재시도',
  fallback:'전환', explanation:'풀이 근거', sent:'전송', acknowledged:'앱 확인', decoding:'음원 읽기',
  saved:'전사 저장', loaded:'전사 연결', attached:'풀이에 사용', detected:'판별 완료'};
const methods = {resize:'크기 조정', crop:'교재 영역 잘라냄', perspective:'기울어진 교재 보정', original:'원본 사용', unreadable:'사진 읽기 실패'};
const providerName = {codex:'Codex 구독', agentrouter:'AgentRouter API', local:'로컬 Whisper', claude:'Claude 구독'};
const kinds = {answer:'답 신호', check:'체크 확인', rescan:'재촬영 신호'};
const choice = (a) => ['','①','②','③','④','⑤'][a] || '';
const timeFormat = new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const when = (stamp) => timeFormat.format(new Date(stamp * 1000));
const duration = (ms) => Number.isFinite(ms) ? (ms/1000).toLocaleString('ko-KR',{maximumFractionDigits:1}) + '초' : '';
const list = (nums) => nums?.length ? nums.join(', ') : '';
const formats = [['all','전체'],['capture','사진'],['route','총괄'],['fragment','취합'],['model','모델'],
  ['solve','풀이'],['listening','듣기'],['delivery','폰']];
let data = {events:[],state:{}}, filter = 'all', selection = null, signature = '';
let currentScreen='overview';
function setScreen(screen){
  currentScreen=screen;
  for(const [target,id] of [['overview','show-overview'],['history','show-history']]){
    $(target).hidden=screen!==target;
    if(screen===target)$(id).setAttribute('aria-current','page');
    else $(id).removeAttribute('aria-current');
  }
  render();
}
$('show-overview').onclick=()=>setScreen('overview');
$('show-history').onclick=()=>setScreen('history');
$('model-open').onclick=()=>$('model-dialog').showModal();
$('model-close').onclick=()=>$('model-dialog').close();
const current = () => {
  const {run}=data.state;
  const latestAudio=data.events.findLast(e=>e.stage==='listening' && !e.job && e.source && e.run && e.run!==run)?.run;
  return data.events.filter(e => !run || !e.run || e.run===run || (e.stage==='listening' && e.run===latestAudio));
};
const badge = (status, text) => el('span',text || labels[status] || status,'badge '+status);
const matches = (e, key) => key==='all' || e.stage===key || (key==='capture' && e.stage==='image') ||
    (key==='route' && e.stage==='model' && e.task==='page_route');
const groupList = (e) => e.groups || (e.group ? [e.group] : []);
function describe(e) {
  if (e.stage==='model') return [providerName[e.provider],e.model,e.task==='page_route'?'총괄 판별':e.question?e.question+'번 풀이':null,
    duration(e.elapsed_ms),e.message].filter(Boolean).join(' / ');
  if (e.stage==='system') return [providerName[e.provider],e.model].filter(Boolean).join(' ');
  if (e.stage==='image') return [e.group?'장면 '+e.group:'',methods[e.method]||e.message,e.width?e.width+' × '+e.height:''].filter(Boolean).join(' / ');
  if (e.stage==='delivery') return [e.question?e.question+'번':'',kinds[e.kind],e.subject,choice(e.answer),e.message].filter(Boolean).join(' ');
  if (e.stage==='listening') return [e.question?e.question+'번':'',e.start!=null?e.start+'–'+e.end+'초':'',e.source,
    e.questions?.length?'문항 '+list(e.questions):null,e.message].filter(Boolean).join(' / ');
  if (e.stage==='capture' && e.status==='received') return ['사진 '+e.frame+'장', '장면 '+e.group, e.similar?'유사 장면':'새 장면'].join(' / ');
  if (e.stage==='route' && e.status==='done') return ['장면 '+e.group,e.page?e.page+'쪽':null,
    e.questions?.length?'문항 '+list(e.questions):'번호 없는 조각',e.turn?'회전 '+e.turn+'°':null].filter(Boolean).join(' / ');
  return [e.question?e.question+'번':null,e.photo_count?e.photo_count+'장':null,choice(e.answer),
    e.group?'장면 '+e.group:e.groups?'장면 '+list(e.groups):null,e.message].filter(Boolean).join(' / ') || stages[e.stage];
}
function renderProviders(events) {
  const attempts=new Map(events.filter(e=>e.stage==='model'&&e.attempt).map(e=>[e.attempt,e]));
  $('providers').replaceChildren(...['codex','agentrouter','claude'].map((provider)=>{
    const own=[...attempts.values()].filter(e=>e.provider===provider);
    const setting=provider==='claude'?'미연결':data.state.provider===provider?'기본 연결':provider==='agentrouter'?'한도 대체':'대기';
    const active=own.filter(e=>e.status==='running'&&e.run===data.state.run&&e.timestamp>=(data.state.started_at||0)).length;
    const line=el('span',null,'provider'); line.append(el('b',providerName[provider]),document.createTextNode(setting));
    if(own.length)line.append(el('span',' / 호출 '+own.length+(active?' / 실행 '+active:''),active?'activity':''));
    return line;
  }));
}
function makeJobs(events) {
  const byKey=new Map();
  for(const e of events) {
    if(e.stage==='solve' && e.job) {
      const key=e.run+'|'+e.job;
      const previous=byKey.get(key) || {};
      byKey.set(key,{...previous,...e,status:e.status==='explanation'?previous.status||'running':e.status,key});
    } else if(e.stage==='delivery' && e.kind==='answer') {
      const job=e.job?byKey.get(e.run+'|'+e.job):
        [...byKey.values()].findLast(j=>j.question===e.question && j.run===e.run && ['done','sent','acknowledged'].includes(j.status));
      if(job && ['sent','acknowledged'].includes(e.status)) job.status=e.status;
    } else if(e.stage==='route' && e.status==='done') {
      for(const q of (e.questions||[])){
        const key=e.run+'|'+(e.page_group||e.group)+':'+q;
        const prev=byKey.get(key);
        if(!prev||['detected','waiting','held'].includes(prev.status)&&!prev.job){
          const a=prev?.coverage?.[q], b=e.coverage?.[q];
          const score=v=>v ? Number(v.stem)*3+v.choices.length+Number(v.end) : 0;
          if(score(b)>=score(a))byKey.set(key,{...e,key,question:q,status:'detected'});
        }
      }
    } else if(e.stage==='fragment' && ['waiting','held'].includes(e.status) && e.question) {
      const item=[...byKey.values()].findLast(j=>j.question===e.question && j.run===e.run && j.status==='detected');
      if(item) item.status=e.status;
    }
  }
  return [...byKey.values()].reverse();
}
function replaceRows(list, nodes){
  const active=list.contains(document.activeElement)?document.activeElement.dataset.rowId:null;
  const top=list.getBoundingClientRect().top;
  const anchor=list.scrollTop>0?[...list.children].find(row=>row.getBoundingClientRect().bottom>top):null;
  const position=anchor?.getBoundingClientRect().top;
  list.replaceChildren(...nodes);
  if(anchor){
    const next=nodes.find(row=>row.dataset.rowId===anchor.dataset.rowId);
    if(next)list.scrollTop+=next.getBoundingClientRect().top-position;
  }
  if(active)nodes.find(row=>row.dataset.rowId===active)?.focus({preventScroll:true});
}
function renderJobs(events) {
  const s=data.state,jobs=s.run?makeJobs(events):[];
  const models=new Map(events.filter(e=>e.stage==='model'&&e.job&&e.attempt).map(e=>[e.run+'|'+e.job,e]));
  $('range').textContent=s.expected?'범위 '+s.expected.join('~')+'번':'';
  $('metrics').textContent=s.run?'인식 '+(s.detected?.length||0)+'개 / 앱 확인 '+(s.delivered?.length||0)+'개'
    +(s.unresolved?.length?' / 미전달 '+s.unresolved.length+'개':'')+(s.unseen?.length?' / 번호 미인식 '+s.unseen.length+'개':''):'';
  if(!jobs.length){if($('jobs').dataset.key!=='empty'){$('jobs').dataset.key='empty';$('jobs').replaceChildren(el('p','사진에서 문항을 찾으면 여기에 표시합니다.','empty'));}return;}
  const key=JSON.stringify(jobs.map(j=>[j,models.get(j.key)]));
  if($('jobs').dataset.key===key){
    for(const span of $('jobs').querySelectorAll('[data-start]'))span.textContent=duration((data.now-Number(span.dataset.start))*1000);
    return;
  }
  $('jobs').dataset.key=key;
  replaceRows($('jobs'),jobs.map(j=>{
    const b=el('button',null,'job'); b.type='button'; b.dataset.rowId=j.key;b.setAttribute('aria-current',selection?.job===j.key);
    const subject=j.subject?(j.subject==='toeic'?'TOEIC':j.subject)+' ':'';
    b.append(el('strong',subject+j.question+'번 '+choice(j.answer)+(j.listening?' / 듣기':'')),badge(j.status));
    const attempt=models.get(j.key);
    if(attempt){
      const modelLine=el('span',[providerName[attempt.provider],attempt.model,attempt.effort].filter(Boolean).join(' / '),'job-model');
      const ms=attempt.elapsed_ms ?? (attempt.status==='running' ? (data.now-attempt.timestamp)*1000 : undefined);
      if(ms!=null){
        const timing=el('span',duration(ms));
        if(attempt.status==='running')timing.dataset.start=attempt.timestamp;
        modelLine.append(document.createTextNode(' / '),timing);
      }
      b.append(modelLine);
    }
    if(j.groups?.length>1||j.listening)b.append(el('span',
      [j.groups?.length>1?'사진 '+j.groups.length+'장 취합':'',j.listening?'듣기 전사':''].filter(Boolean).join(' / '),'job-path'));
    const observed=j.coverage?.[j.question];
    if(observed&&['detected','held','waiting'].includes(j.status)){
      const missing=[!observed.stem?'지문 확인 필요':'',observed.choices.length?'보기 '+observed.choices.map(choice).join(' '):'보기 확인 필요',
        !observed.end&&observed.choices.length?'보기 끝 확인 필요':''].filter(Boolean);
      if(missing.length)b.append(el('span',missing.join(' / '),'job-path'));
    }
    if(j.explanation||j.message)b.append(el('span',j.explanation||j.message,'job-reason'));
    b.onclick=()=>select({job:j.key});return b;
  }));
}
function setFilter(key){ filter=key; $('events').scrollTop=0;render(); }
function select(item) {
  selection=item;
  if(currentScreen!=='history')setScreen('history');
  else render();
  $('inspector').focus({preventScroll:true});
  $('inspector').scrollIntoView({behavior:'instant',block:'nearest'});
}
function renderEvents(events) {
  if(!$('tabs').children.length)$('tabs').replaceChildren(...formats.map(([key,label])=>{
    const b=el('button',label);b.type='button';b.dataset.filter=key;b.onclick=()=>setFilter(key);return b;
  }));
  for(const button of $('tabs').children)button.setAttribute('aria-pressed',button.dataset.filter===filter);
  const rows=events.filter(e=>matches(e,filter)).slice(-100).reverse();
  const key=filter+'|'+(selection?.event||0)+'|'+rows.map(e=>e.id).join(',');
  if($('events').dataset.key===key)return;
  $('events').dataset.key=key;
  if(!rows.length){$('events').replaceChildren(el('p','아직 이 단계의 기록이 없습니다. 폰에서 새 촬영을 시작하면 진행 상황이 표시됩니다.','empty'));return;}
  replaceRows($('events'),rows.map(e=>{
    const b=el('button',null,'row'); b.type='button';b.dataset.rowId=e.id; b.setAttribute('aria-current',selection?.event===e.id);
    b.append(el('time',when(e.timestamp)),el('span',stages[e.stage]||e.stage,'label'),el('span',describe(e),'title'),badge(e.status));
    b.onclick=()=>select({event:e.id});return b;
  }));
}
function renderDetail(events) {
  const panel=$('detail');
  if(!selection)return;
  const all=data.events;
  const job=selection.job?makeJobs(events).find(j=>j.key===selection.job):null;
  const item=job||all.find(e=>e.id===selection.event);
  if(!item){panel.textContent='선택한 기록이 현재 목록에 없습니다.';return;}
  const version=JSON.stringify([item.id,item.key,item.status,all.at(-1)?.id]);
  if(panel.dataset.version===version||panel.contains(document.activeElement))return;
  panel.dataset.version=version;
  const old=panel.querySelector('details');
  const open=old?.open || false;
  $('detail-title').textContent=item.question?item.question+'번 처리 상세':stages[item.stage]+' 상세';
  const associated=all.filter(e=>e.run===item.run && (
    item.job && e.job===item.job || item.question && e.question===item.question && !e.job && ['fragment','delivery'].includes(e.stage)
    || item.attempt && e.attempt===item.attempt || e.id===item.id));
  const groups=new Set([item,...associated].flatMap(groupList));
  const photos=new Map(all.filter(e=>e.run===item.run&&e.filename&&groups.has(e.group)).map(e=>[e.group,e.filename]));
  const frames=all.filter(e=>e.run===item.run&&e.stage==='route'&&e.coverage&&groups.has(e.group));
  const linked=associated.findLast(e=>e.explanation)||item;
  const audio=associated.findLast(e=>e.transcript)||item;
  const explanation=el('div',null,'section');
  if(linked.explanation){
    explanation.append(el('h3','풀이 근거'),el('p',linked.explanation));
  } else {
    explanation.append(el('h3',stages[item.stage]||'처리 결과'),el('p',describe(item)));
  }
  if(item.stage==='delivery'){
    const signal=all.findLast(e=>e.packet===item.packet&&Array.isArray(e.segments));
    if(signal){
      explanation.append(el('h3','진동 순서'));
      const ul=el('ul');
      signal.segments.forEach(({label,marks})=>ul.append(el('li',marks?label+' '+marks:label)));
      explanation.append(ul);
    }
  }
  if(audio.transcript){
    const d=el('details');d.open=open||item.stage==='listening';d.append(el('summary','듣기 전사 보기'),el('pre',audio.transcript));explanation.append(d);
  }
  if(frames.length){
    const table=el('table',null,'coverage');const head=el('tr');
    ['장면','문항','지문','보이는 보기','보기 끝'].forEach(v=>head.append(el('th',v)));table.append(head);
    const unique=new Map();
    frames.forEach(e=>Object.entries(e.coverage).forEach(([q,v])=>{if(!item.question||Number(q)===item.question)unique.set(e.group+':'+q,[e.group,q,v]);}));
    for(const [group,q,v] of unique.values()){
      const tr=el('tr');[group,q,v.stem?'확인':'부족',list(v.choices)||'—',v.end?'확인':'부족'].forEach(text=>tr.append(el('td',text)));table.append(tr);
    }
    if(unique.size){explanation.append(el('h3','사진별 판독', 'coverage-title'),table);}
  }
  const context=el('div',null,'section');context.append(el('h3','사용한 자료와 모델'));
  if(photos.size){
    const holder=el('div',null,'photos');
    const items=[...photos];
    items.forEach(([group,file],index)=>{
      const button=el('button',null,'photo-open');button.type='button';
      button.setAttribute('aria-label','장면 '+group+' 사진 크게 보기');
      const image=el('img');image.loading='lazy';image.src='/photo/'+encodeURIComponent(file);image.alt='장면 '+group+' 원본';
      button.append(image,el('span','장면 '+group));button.onclick=()=>openPhoto(items,index);holder.append(button);
    });
    context.append(holder);
  }
  const attempts=new Map(associated.filter(e=>e.stage==='model'&&e.attempt).map(e=>[e.attempt,e]));
  if(!attempts.size&&item.stage==='route'){
    all.filter(e=>e.stage==='model'&&e.run===item.run&&e.attempt&&groupList(e).some(g=>groups.has(g))).forEach(e=>attempts.set(e.attempt,e));
  }
  if(attempts.size){
    const ul=el('ul');
    for(const e of attempts.values()){
      const strings=[providerName[e.provider],e.model,e.effort,labels[e.status],duration(e.elapsed_ms),
        e.session?'세션 '+e.session:null,e.usage?.input_tokens!=null?'입력 '+e.usage.input_tokens.toLocaleString('ko-KR')+' 토큰':null,
        e.usage?.output_tokens!=null?'출력 '+e.usage.output_tokens.toLocaleString('ko-KR')+' 토큰':null];
      ul.append(el('li',strings.filter(Boolean).join(' / ')));
    }
    context.append(ul);
  }else if(!photos.size){context.append(el('p','이 기록에 연결된 사진이나 모델 호출이 없습니다.','hint'));}
  if(associated.length>1){
    const ul=el('ul');
    associated.filter(e=>e.stage!=='image' && e.stage!=='model' && !e.explanation).slice(-8)
      .forEach(e=>ul.append(el('li',when(e.timestamp)+' '+stages[e.stage]+' '+labels[e.status]+' '+(e.message||''))));
    context.append(ul);
  }
  panel.replaceChildren(explanation,context);
}
let photoItems=[],photoIndex=0;
function showPhoto(){
  const [group,file]=photoItems[photoIndex];
  $('photo-title').textContent='장면 '+group+' 원본';
  $('photo-large').src=file.startsWith('/')?file:'/photo/'+encodeURIComponent(file);
  $('photo-large').alt='장면 '+group+' 원본';
  $('photo-count').textContent=(photoIndex+1)+' / '+photoItems.length;
  $('photo-prev').disabled=photoIndex===0;
  $('photo-next').disabled=photoIndex===photoItems.length-1;
}
function openPhoto(items,index){
  photoItems=items;photoIndex=index;showPhoto();
  $('photo-modal').showModal();
  $('photo-close').focus();
}
function movePhoto(by){
  const next=photoIndex+by;
  if(next<0||next>=photoItems.length)return;
  photoIndex=next;showPhoto();
}
$('photo-close').onclick=()=>$('photo-modal').close();
$('photo-prev').onclick=()=>movePhoto(-1);
$('photo-next').onclick=()=>movePhoto(1);
$('photo-modal').addEventListener('click',event=>{
  if(event.target!==event.currentTarget)return;
  const rect=event.currentTarget.getBoundingClientRect();
  if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)event.currentTarget.close();
});
$('photo-modal').addEventListener('keydown',event=>{
  if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
    event.preventDefault();
    movePhoto(event.key==='ArrowLeft'?-1:1);
  }
});
function renderLivePhotos(events){

  const archive=events.filter(e=>e.stage==='capture'&&e.filename&&(!available||available.has(e.filename)));
  const rows=incoming ? recent.slice().reverse().map(e=>({...e,url:'/live-photo/'+e.id}))
    : [...new Map(archive.map(e=>[e.group,e])).values()].slice(-5).reverse().map(e=>({...e,url:'/photo/'+encodeURIComponent(e.filename)}));

  if(!rows.length){
    if(panel.dataset.signature!=='empty'){
      panel.dataset.signature='empty';
      panel.replaceChildren(head,el('p','폰에서 촬영을 시작하면 여기에 사진이 표시됩니다.','empty'));

  imageButton.setAttribute('aria-label','가장 최근 사진 크게 보기');
  const photo=el('img');photo.src=newest.url;photo.alt='가장 최근 폰 사진';
  imageButton.append(photo);imageButton.onclick=()=>openPhoto(items,0);big.append(imageButton);
  const focus=Number.isFinite(newest.focus_y)?' / 초점 높이 '+Math.round(newest.focus_y*100)+'%':'';
  big.append(el('p',[when(newest.timestamp),newest.frame?'사진 '+newest.frame+'장':null,'장면 '+newest.group]
      .filter(Boolean).join(' / ')+focus,'live-meta'));
  const strip=el('div',null,'live-recent');
  rows.slice(1,5).forEach((entry,i)=>{
    const b=el('button',null,'photo-open');b.type='button';
    b.setAttribute('aria-label','받은 장면 '+entry.group+' 크게 보기');
    const thumb=el('img');thumb.src=entry.url;thumb.alt='장면 '+entry.group;
    b.append(thumb,el('span','장면 '+entry.group));b.onclick=()=>openPhoto(items,i+1);strip.append(b);
  });
  body.append(big,strip);panel.replaceChildren(head,body);

function renderQueue() {
  const s=data.state;
  const stats=el('dl',null,'queue-stats');
  for(const [label,value] of [['수신',s.received||0],['판별 대기',s.route_queued||0],['풀이 중·대기',(s.solve_pending||0)+(s.solve_deferred||0)]]){
    const stat=el('div',null,'queue-stat');
    stat.append(el('dt',label),el('dd',String(value)));
    stats.append(stat);
  }
  const lines=el('div',null,'queue-lines');
  const subject=s.subject?(s.subject==='toeic'?'TOEIC':s.subject):'';
  if(s.routing_groups?.length)lines.append(el('p',['장면 '+list(s.routing_groups)+' 판별 중',subject].filter(Boolean).join(' / ')));
  if(s.pending_questions?.length)lines.append(el('p','처리할 문항 '+list(s.pending_questions)));
  if(!lines.children.length)lines.append(el('p',s.received?'받은 사진의 처리를 마쳤습니다.':'폰에서 사진을 보내면 여기에 진행 상태가 표시됩니다.'));
  const chief=current().findLast(e=>e.stage==='model'&&e.task==='page_route');
  if(s.route_running&&chief?.status==='running')lines.append(el('p',chief.model+' / '+duration((data.now-chief.timestamp)*1000)));
  if(s.power&&data.now-s.power.seen_at<75&&s.power.thermal>=3)lines.append(el('p','폰 발열로 촬영 간격을 늘렸습니다.'));
  $('queue').replaceChildren(el('h2','작업 대기열'),stats,lines);
}
function renderDeviceInfo(){
  const s=data.state;
  const rows=[];
  if(s.power&&data.now-s.power.seen_at<75){
    const state=['정상','약함','보통','심함','매우 심함','긴급','종료 단계'][s.power.thermal];
    rows.push(el('p','폰 배터리 '+s.power.level+'% / '+(s.power.charging?'충전 중':'충전 중 아님')+' / 발열 '+state));
  }
  if(s.archive){
    const mb=bytes=>Math.round(bytes/1048576).toLocaleString('ko-KR')+' MB';
    rows.push(el('p','PC 사진 '+s.archive.photos+'장 / '+mb(s.archive.bytes)+' / 한도 '+mb(s.archive.limit)));
  }
  $('device-detail').replaceChildren(...rows);
}
const modelForm=$('model-settings');
const presets={fast:['gpt-6-luna','gpt-6-luna'],balanced:['gpt-6-luna','gpt-6.1-sol'],precise:['gpt-6.1-sol','gpt-6.1-sol']};
const presetButtons=[...modelForm.querySelectorAll('[data-preset]')];
let modelEdited=false, modelSaving=false;
function markPreset(){
  const {route,solve}=modelForm.elements;
  for(const button of presetButtons){
    const [judge,answer]=presets[button.dataset.preset];
    button.setAttribute('aria-pressed',String(route.value===judge && solve.value===answer));
  }
}
function editModel(){
  modelEdited=true;
  $('model-save').textContent='적용을 누르면 저장됩니다';
  markPreset();
}
modelForm.addEventListener('change',editModel);
for(const button of presetButtons)button.addEventListener('click',()=>{
  const [route,solve]=presets[button.dataset.preset];
  modelForm.elements.route.value=route;
  modelForm.elements.solve.value=solve;
  editModel();
});
function renderModelSettings(){
  const s=data.state.models;
  modelForm.hidden=!s;
  $('model-open').disabled=!s;
  if(!s||modelEdited||modelSaving)return;
  modelForm.elements.route.value=s.route;
  modelForm.elements.solve.value=s.solve;
  modelForm.elements.parallel.checked=s.parallel;
  markPreset();
}
modelForm.addEventListener('submit',async event=>{
  event.preventDefault();
  if(modelSaving)return;
  const {route,solve,parallel}=modelForm.elements;
  const settings={route:route.value,solve:solve.value,parallel:parallel.checked};
  const fields=[...modelForm.elements];
  modelSaving=true;
  for(const field of fields)field.disabled=true;
  try{
    const r=await fetch('/settings/models',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(settings)});
    if(!r.ok)throw Error();
    data.state.models=await r.json();
    modelEdited=false;
    $('model-save').textContent='다음 모델 호출부터 적용';
  }catch{$('model-save').textContent='저장 실패. 다시 적용해 주세요.';}
  finally{
    modelSaving=false;
    for(const field of fields)field.disabled=false;
  }
});
$('model-dialog').addEventListener('close',()=>{
  if(modelSaving)return;
  modelEdited=false;
  $('model-save').textContent='';
  renderModelSettings();
});
function render(){
  const events=current();
  renderModelSettings();
  if(currentScreen==='overview'){
    renderLivePhotos(events);
    renderQueue();
    renderJobs(events);
  }else{
    renderProviders(data.events);
    renderDeviceInfo();
    renderEvents(data.events);
    renderDetail(data.events);
  }
}
async function refresh(){
  try {
    const response=await fetch('/state',{cache:'no-store',signal:AbortSignal.timeout(4500)});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const next=await response.json();
    $('connection').className='status online';
    $('connection').lastElementChild.textContent=next.state.demo?'모의 연결':'실시간 연결';
    $('clock').textContent=when(next.now)+' 갱신';
    const nextSignature=JSON.stringify(next.state)+':'+(next.events.at(-1)?.id||0);
    data=next;
    if(nextSignature!==signature){signature=nextSignature;render();}
    else if(currentScreen==='overview'&&(data.state.route_running||data.state.solve_pending)){
      renderQueue();
      renderJobs(current());
    }
  }catch{
    $('connection').className='status offline';
    $('connection').lastElementChild.textContent='서버 연결 끊김';
    if(!signature)$('events').replaceChildren(el('p','노트북에서 학습 보조기 서버를 실행하면 자동으로 다시 연결합니다.','empty'));
  }finally{setTimeout(refresh,1800);}
}
render();
refresh();
</script>
</body>
</html>
